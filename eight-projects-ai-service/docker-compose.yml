# 单机形态（切片 0 / CS-013 / ADR-0041）：Caddy（TLS）→ API 蓝绿双副本 → PostgreSQL 16 + pgvector + pg-boss
# 发布：./scripts/deploy.sh（构建新镜像 → 轮换重启 blue、green，Caddy 健康检查保证零中断）
# 备份 / 恢复：./scripts/backup-db.sh、./scripts/restore-db.sh；演练记录见 docs/DRILLS.md

x-api: &api
  image: eight-projects-ai-service:latest
  # 镜像只在本机由 api-blue 的 build 产生，绝不从仓库拉取
  pull_policy: never
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - .env            # LLM_API_KEY / LLM_BASE_URL / LLM_FALLBACK_* / SESSION_SECRET / EMBEDDING_* / WECHAT_* / TAOBAO_*
  environment: &api-env
    SERVE_WEB: "1"
    DATA_DIR: /data
    API_PORT: "8787"
    TZ: Asia/Shanghai
    DATABASE_URL: postgres://eight:${POSTGRES_PASSWORD:-eight}@postgres:5432/eight
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eight
      POSTGRES_USER: eight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eight}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eight -d eight"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-blue:
    <<: *api
    build: .
    container_name: eight-api-blue
    environment:
      <<: *api-env
      INSTANCE_COLOR: blue
    volumes:
      - api-data:/data

  api-green:
    <<: *api
    container_name: eight-api-green
    environment:
      <<: *api-env
      INSTANCE_COLOR: green
    volumes:
      - api-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: eight-caddy
    restart: unless-stopped
    depends_on:
      - api-blue
      - api-green
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # ICP 通过后设为域名（如 cs.example.com）即自动 HTTPS；为空时监听 :80
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  api-data:
  caddy-data:
  caddy-config:
